[project]
name = "quinney"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "kratosconstitutivelawsapplication==10.4.3",
    "kratosconvectiondiffusionapplication==10.4.3",
    "kratoslinearsolversapplication==10.4.3",
    "kratosmeshingapplication==10.4.3",
    "kratosmpmapplication==10.4.3",
    "kratosmultiphysics==10.4.3",
    "kratosstructuralmechanicsapplication==10.4.3",
    "numpy>=2.5.2",
    "scipy>=1.18.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quinney"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
